<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Least-Privilege Access Review Workbench</title>
  <desc id="desc">A least-privilege access graph showing risky paths becoming a safe staged plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07110f"/>
      <stop offset="1" stop-color="#102b23"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#67f5b3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#67f5b3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="920" cy="100" r="390" fill="url(#glow)"/>
  <text x="72" y="92" fill="#67f5b3" font-family="monospace" font-size="18" letter-spacing="3">LEAST-PRIVILEGE ACCESS REVIEW WORKBENCH · WEBMCP</text>
  <text x="72" y="178" fill="#edf7f3" font-family="Arial, sans-serif" font-weight="700" font-size="62">Least privilege,</text>
  <text x="72" y="247" fill="#edf7f3" font-family="Arial, sans-serif" font-weight="700" font-size="62">with every path explained.</text>
  <text x="74" y="303" fill="#91aaa1" font-family="Arial, sans-serif" font-size="22">Inspect · trace · simulate · stage · visible confirm</text>
  <g transform="translate(72 370)">
    <rect width="180" height="92" rx="22" fill="#183c30" stroke="#67f5b3" stroke-opacity=".5"/>
    <circle cx="46" cy="40" r="17" fill="none" stroke="#67f5b3" stroke-width="3"/>
    <text x="78" y="38" fill="#edf7f3" font-family="Arial" font-weight="700" font-size="18">Alex Morgan</text>
    <text x="78" y="61" fill="#ff9090" font-family="monospace" font-size="13">contract ended</text>
    <path d="M180 28 C260 -20 305 -12 380 28" fill="none" stroke="#ff6b6b" stroke-width="5"/>
    <path d="M180 49 C265 48 300 49 380 49" fill="none" stroke="#ffbd5b" stroke-width="5" stroke-dasharray="10 8"/>
    <path d="M180 70 C260 122 305 110 380 70" fill="none" stroke="#67f5b3" stroke-width="5"/>
    <rect x="380" width="220" height="92" rx="22" fill="#172421" stroke="#90a69e" stroke-opacity=".35"/>
    <text x="490" y="38" text-anchor="middle" fill="#edf7f3" font-family="Arial" font-weight="700" font-size="20">Sensitive access</text>
    <text x="490" y="64" text-anchor="middle" fill="#91aaa1" font-family="monospace" font-size="13">5 removed · 1 reassigned</text>
  </g>
  <g transform="translate(760 350)">
    <rect width="355" height="155" rx="26" fill="#0c201a" stroke="#67f5b3" stroke-opacity=".4"/>
    <text x="30" y="40" fill="#91aaa1" font-family="monospace" font-size="13" letter-spacing="3">EXPOSURE SCORE</text>
    <text x="30" y="106" fill="#ff6b6b" font-family="monospace" font-size="58">92</text>
    <text x="145" y="102" fill="#91aaa1" font-family="Arial" font-size="35">→</text>
    <text x="218" y="106" fill="#67f5b3" font-family="monospace" font-size="58">18</text>
  </g>
  <text x="72" y="574" fill="#728a81" font-family="monospace" font-size="15">Synthetic demo · no credentials required · no WebMCP revocation</text>
</svg>
