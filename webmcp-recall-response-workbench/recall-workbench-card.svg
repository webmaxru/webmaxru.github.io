<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Recall Response Workbench</title>
  <desc id="desc">8,420 candidate orders narrowed to 37 exact recipients with 213 lookalikes excluded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d221c"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#59e6ae" stop-opacity=".25"/>
      <stop offset="1" stop-color="#59e6ae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="40" r="380" fill="url(#glow)"/>
  <g fill="none" stroke="#9fe8cc" stroke-opacity=".18">
    <circle cx="1060" cy="-10" r="220"/>
    <circle cx="1060" cy="-10" r="300"/>
  </g>
  <g transform="translate(78 65)">
    <rect width="48" height="48" rx="13" fill="#173c30" stroke="#59e6ae" stroke-opacity=".4"/>
    <path d="M17 14h14v19c0 5-14 5-14 0z" fill="none" stroke="#59e6ae" stroke-width="2.5"/>
    <circle cx="24" cy="22" r="3" fill="#59e6ae"/>
    <text x="66" y="20" fill="#8ba49a" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">OPERATIONS SAFETY</text>
    <text x="66" y="42" fill="#eef7f3" font-family="Arial, sans-serif" font-weight="700" font-size="20">Recall Response Workbench</text>
  </g>
  <text x="78" y="215" fill="#eef7f3" font-family="Arial, sans-serif" font-weight="700" font-size="58" letter-spacing="-2">
    <tspan x="78" dy="0">Find the right 37.</tspan>
    <tspan x="78" dy="67">Leave the other 8,383 alone.</tspan>
  </text>
  <text x="80" y="380" fill="#95aaa2" font-family="Arial, sans-serif" font-size="20">An explainable, human-in-the-loop WebMCP recall workflow.</text>
  <g transform="translate(78 438)">
    <rect width="252" height="105" rx="14" fill="#10251f" stroke="#afddca" stroke-opacity=".14"/>
    <text x="20" y="30" fill="#81998f" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.5">CANDIDATE ORDERS</text>
    <text x="20" y="76" fill="#eef7f3" font-family="Arial, sans-serif" font-size="39" font-weight="700">8,420</text>
    <rect x="268" width="252" height="105" rx="14" fill="#10251f" stroke="#59e6ae" stroke-opacity=".25"/>
    <text x="288" y="30" fill="#8fdaba" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.5">EXACT RECIPIENTS</text>
    <text x="288" y="76" fill="#70ebb8" font-family="Arial, sans-serif" font-size="39" font-weight="700">37</text>
    <rect x="536" width="252" height="105" rx="14" fill="#10251f" stroke="#f5ba65" stroke-opacity=".25"/>
    <text x="556" y="30" fill="#bcaa8e" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.5">LOOKALIKES EXCLUDED</text>
    <text x="556" y="76" fill="#f3ca8e" font-family="Arial, sans-serif" font-size="39" font-weight="700">213</text>
  </g>
  <g transform="translate(930 465)">
    <rect width="190" height="46" rx="23" fill="#153d30" stroke="#59e6ae" stroke-opacity=".35"/>
    <circle cx="25" cy="23" r="5" fill="#59e6ae"/>
    <text x="43" y="29" fill="#b9f4dc" font-family="Arial, sans-serif" font-size="15" font-weight="700">WebMCP ready</text>
  </g>
</svg>
