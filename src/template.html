<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta name="author" content="Maxim Salnikov" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="{{SITE_URL}}" />
    <meta name="theme-color" content="#efebe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#363332" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/brand/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maxim Salnikov" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:image" content="{{SOCIAL_IMAGE_URL}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portrait of Maxim Salnikov beside the words Maxim builds"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SOCIAL_IMAGE_URL}}" />
    <meta
      name="twitter:image:alt"
      content="Portrait of Maxim Salnikov beside the words Maxim builds"
    />
    <script type="application/ld+json">
{{STRUCTURED_DATA}}
    </script>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }

      :root {
        --cp-bg-contrast: #efebe4;
      }

      html[data-theme="dark"] {
        --cp-bg-contrast: #363332;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--cp-bg);
        background-color: var(--cp-bg-contrast);
        color: var(--cp-text);
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.5;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--cp-accent);
        outline-offset: 4px;
      }

      ::selection {
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
      }

      .site-shell {
        width: min(100% - 48px, 1240px);
        margin: 0 auto;
      }

      .site-header {
        padding: 20px 0 28px;
        border-bottom: 1px solid var(--cp-border);
      }

      .utility-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--cp-accent);
        font-weight: 700;
      }

      .wordmark-avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 50%;
      }

      .utility-note {
        color: var(--cp-text-soft);
      }

      .hero {
        display: block;
        padding-top: 48px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 900px;
        margin-bottom: 18px;
        font-size: clamp(3.8rem, 8vw, 7.2rem);
        font-weight: 650;
        letter-spacing: -0.085em;
        line-height: 0.86;
      }

      .hero-title-mark {
        color: var(--cp-accent);
      }

      .hero-lede {
        max-width: 640px;
        margin-bottom: 0;
        color: var(--cp-text-muted);
        font-size: clamp(1.15rem, 2vw, 1.5rem);
        letter-spacing: -0.025em;
        line-height: 1.25;
      }

      .category-index {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin-top: 30px;
        border-top: 1px solid var(--cp-border);
        border-bottom: 1px solid var(--cp-border);
      }

      .category-link {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 10px 14px;
        border-right: 1px solid var(--cp-border);
        color: var(--cp-text-muted);
        font-size: 0.84rem;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .category-link:last-child {
        border-right: 0;
      }

      .category-link:hover {
        background: var(--cp-accent-soft);
        color: var(--cp-accent);
      }

      .category-number,
      .category-count,
      .section-index,
      .section-count,
      .repo-name {
        color: var(--cp-text-soft);
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      .category-count {
        color: var(--cp-accent);
      }

      main {
        padding-bottom: 120px;
      }

      .project-section {
        scroll-margin-top: 28px;
        padding-top: 54px;
      }

      .section-heading {
        display: grid;
        grid-template-columns: auto auto minmax(40px, 1fr) auto;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin-bottom: 0;
        font-size: clamp(1.8rem, 3vw, 2.7rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .section-index {
        color: var(--cp-accent);
      }

      .section-rule {
        height: 1px;
        background: var(--cp-border);
      }

      .section-count {
        color: var(--cp-text-muted);
        white-space: nowrap;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .project-card {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-surface);
        box-shadow: 0 1px 2px var(--cp-highlight);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .project-card:hover {
        border-color: var(--cp-border-strong);
        box-shadow: 0 6px 20px var(--cp-highlight);
        transform: translateY(-2px);
      }

      .project-thumb {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-bottom: 1px solid var(--cp-border);
        background: var(--cp-surface-soft);
      }

      .project-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 240ms ease;
      }

      .project-card:hover .project-thumb img {
        transform: scale(1.025);
      }

      .thumb-fallback {
        display: none;
        align-content: space-between;
        justify-items: start;
        width: 100%;
        height: 100%;
        padding: 22px;
        background: var(--cp-accent-soft);
        color: var(--cp-accent);
      }

      .thumb-mark {
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: clamp(2.8rem, 6vw, 5rem);
        letter-spacing: -0.08em;
        line-height: 0.9;
      }

      .thumb-fallback-name {
        max-width: 75%;
        color: var(--cp-text);
        font-size: 0.9rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .project-thumb.has-fallback .thumb-fallback {
        display: grid;
      }

      .thumb-label {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 5px 8px;
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        background: var(--cp-panel-strong);
        color: var(--cp-text-muted);
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .card-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 22px 22px 20px;
      }

      .card-title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .card-title-row h3 {
        margin-bottom: 0;
        font-size: 1.2rem;
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }

      .repo-name {
        flex: 0 0 auto;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-body p {
        max-width: 34rem;
        margin-bottom: 28px;
        color: var(--cp-text-muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .card-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: auto;
      }

      .live-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--cp-accent);
        font-size: 0.86rem;
        font-weight: 650;
      }

      .live-link:hover {
        color: var(--cp-accent-hover);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .github-link {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        color: var(--cp-text-muted);
        transition:
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .github-link svg {
        width: 18px;
        height: 18px;
      }

      .github-link:hover {
        border-color: var(--cp-accent);
        background: var(--cp-accent-soft);
        color: var(--cp-accent);
      }

      .site-footer {
        padding: 34px 0 40px;
        border-top: 1px solid var(--cp-border);
      }

      .footer-inner {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 32px;
      }

      .footer-title {
        margin-bottom: 8px;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .footer-note {
        margin-bottom: 0;
        color: var(--cp-text-soft);
        font-size: 0.85rem;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 12px 24px;
        font-size: 0.9rem;
      }

      .footer-links a {
        color: var(--cp-text-muted);
      }

      .footer-links a:hover {
        color: var(--cp-accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .footer-links span {
        color: var(--cp-text-soft);
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: 0.78rem;
      }

      @media (max-width: 980px) {
        .project-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        .site-shell {
          width: min(100% - 32px, 1240px);
        }

        .site-header {
          padding-bottom: 56px;
        }

        .utility-note {
          max-width: 145px;
          font-size: 0.66rem;
          line-height: 1.2;
          text-align: right;
        }

        .hero {
          padding-top: 44px;
        }

        h1 {
          font-size: clamp(3.8rem, 19vw, 6.5rem);
        }

        .category-index {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .category-link:nth-child(2) {
          border-right: 0;
        }

        .category-link:nth-child(-n + 2) {
          border-bottom: 1px solid var(--cp-border);
        }

        .project-section {
          padding-top: 76px;
        }

        .section-heading {
          grid-template-columns: auto 1fr auto;
        }

        .section-rule {
          display: none;
        }

        .section-count {
          grid-column: 2 / -1;
          grid-row: 2;
        }

        .project-grid {
          grid-template-columns: 1fr;
        }

        .footer-inner {
          flex-direction: column;
        }

        .footer-links {
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="utility-bar">
          <a class="wordmark" href="/" aria-label="Maxim Salnikov home">
            <img
              class="wordmark-avatar"
              src="/assets/brand/portrait-512.png"
              alt=""
              width="30"
              height="30"
            />
            <span>MAXIM SALNIKOV</span>
          </a>
          <a class="utility-note" href="https://github.com/webmaxru" target="_blank" rel="noopener noreferrer">
            @WEBMAXRU ON GITHUB
          </a>
        </div>

        <div class="hero">
          <div>
            <h1>Maxim builds<span class="hero-title-mark">.</span></h1>
            <p class="hero-lede">Some of my projects and experiments</p>
          </div>
        </div>

        <nav class="category-index" aria-label="Project categories">
          {{CATEGORY_NAVIGATION}}
        </nav>
      </header>

      <main>
        {{PROJECT_SECTIONS}}
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div>
            <div class="footer-title">Connect with me.</div>
            <p class="footer-note">More work, notes, and experiments live on GitHub.</p>
          </div>
          <nav class="footer-links" aria-label="Social links">
            <a href="https://www.linkedin.com/in/webmax/" target="_blank" rel="noopener noreferrer">
              LinkedIn <span>@webmax</span>
            </a>
            <a href="https://github.com/webmaxru" target="_blank" rel="noopener noreferrer">
              GitHub <span>@webmaxru</span>
            </a>
          </nav>
        </div>
      </footer>
    </div>
  </body>
</html>
