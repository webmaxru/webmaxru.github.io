name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out Launchpane
        uses: actions/checkout@v4
        with:
          repository: webmaxru/Launchpane
          path: launchpane

      - name: Build and validate static site
        run: npm run check

      - name: Build Launchpane project site
        working-directory: launchpane
        run: node scripts/build-site.mjs

      - name: Publish Launchpane project route
        run: |
          mkdir -p dist/projects
          cp -R launchpane/dist/site dist/projects/launchpane

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
